[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleanedweb"
dynamic = ["version"]
description = "Python client for CleanedWeb: maintained REST APIs that return structured records from public websites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "CleanedWeb" }]
keywords = ["cleanedweb", "api", "web data", "scraping", "structured data", "llm", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.urls]
Homepage = "https://cleanedweb.com/?utm_source=github&utm_medium=cleanedweb-python"
Documentation = "https://cleanedweb.com/docs/python/?utm_source=github&utm_medium=cleanedweb-python"
Repository = "https://github.com/cleanedweb/cleanedweb-python"
Changelog = "https://github.com/cleanedweb/cleanedweb-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10", "build"]

[tool.hatch.version]
path = "src/cleanedweb/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanedweb"]

[tool.hatch.build.targets.sdist]
include = ["src/cleanedweb", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["UP006", "UP007", "UP035", "UP045", "A003", "B904"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/cleanedweb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the public no-key catalog read endpoints (network); run with -m live"]
